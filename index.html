<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR Simplificado</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://jsdelivr.net"></script>
    <!-- Librería QRCode.js compatible con acentos y Ñ -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">🎨 Generador QR</h1>
        <p class="text-xs text-center text-slate-500 mb-6 font-medium">Compatible con acentos y Ñ</p>

        <!-- Formulario -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre(s):</label>
                <input type="text" id="nombre" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. María">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Apellido Paterno:</label>
                <input type="text" id="paterno" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. Núñez">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Apellido Materno:</label>
                <input type="text" id="materno" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej. López">
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex gap-3 mt-6">
            <button onclick="generarQR()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">🎨 Generar Código QR</button>
            <button onclick="limpiar()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-lg transition">🔄 Limpiar</button>
        </div>

        <!-- Contenedor del QR (Oculto al inicio) -->
        <div id="resultado" class="hidden mt-8 flex flex-col items-center border-t border-slate-100 pt-6">
            <div id="qrcode" class="p-3 bg-white border border-slate-200 rounded-xl shadow-sm"></div>
            <button onclick="descargarQR()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg transition flex items-center justify-center gap-2">
                📥 Descargar
            </button>
        </div>
    </div>

    <script>
        let qrInstancia = null;

        // Función para codificar correctamente caracteres UTF-8 (acentos y Ñ) sin romper la librería
        function deStringAUtf8(str) {
            return Array.from(new TextEncoder().encode(str)).map(b => String.fromCharCode(b)).join('');
        }

        function generarQR() {
            const nombre = document.getElementById('nombre').value.trim();
            const paterno = document.getElementById('paterno').value.trim();
            const materno = document.getElementById('materno').value.trim();

            if (!nombre || !paterno) {
                alert('Por favor, ingresa al menos el Nombre y el Apellido Paterno.');
                return;
            }

            // RESTRUCTURADO: Primero Apellido Paterno, luego Materno y finalmente Nombre(s)
            const textoEstructurado = `${paterno} ${materno} ${nombre}`.replace(/\s+/g, ' ').trim();

            // Limpiamos el contenedor del QR anterior
            const contenedorQR = document.getElementById("qrcode");
            contenedorQR.innerHTML = "";

            // Convertimos el texto para asegurar soporte total de acentos
            const textoFormateado = deStringAUtf8(textoEstructurado);

            // Generamos el nuevo código QR
            qrInstancia = new QRCode(contenedorQR, {
                text: textoFormateado,
                width: 180,
                height: 180,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Mostramos el contenedor de resultados
            document.getElementById('resultado').classList.remove('hidden');
        }

        function limpiar() {
            document.getElementById('nombre').value = '';
            document.getElementById('paterno').value = '';
            document.getElementById('materno').value = '';
            document.getElementById('resultado').classList.add('hidden');
            document.getElementById("qrcode").innerHTML = "";
            qrInstancia = null;
        }

        function descargarQR() {
            const img = document.querySelector('#qrcode img');
            if (img) {
                const paterno = document.getElementById('paterno').value.trim() || "codigo";
                const enlace = document.createElement('a');
                enlace.href = img.src;
                enlace.download = `QR_${paterno}.png`;
                enlace.click();
            } else {
                alert('Primero genera el código QR para poder descargarlo.');
            }
        }
    </script>
</body>
</html>
